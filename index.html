    --gold: #FFC857;
    --white: #FFFFFF;

    font-family: 'Quicksand', sans-serif;

                radial-gradient(circle at 85% 80%, #FFD3E2 0%, transparent 50%),

    min-height: 100vh;
  }

  .font-display{ font-family: 'Playfair Display', serif; }

  ::selection{ background: var(--pink-blush); color: var(--maroon); }

  /* ---------- floating hearts / flowers ---------- */
  .particle-layer{
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5;
  }
  .particle{
    position: absolute;
    top: -10vh;
    will-change: transform, opacity;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    filter: drop-shadow(0 2px 4px rgba(200,50,100,0.15));
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    8%{ opacity: 1; }
    50%{ transform: translateY(50vh) translateX(20px) rotate(180deg); }
    92%{ opacity: 0.9; }
    100%{ transform: translateY(112vh) translateX(-15px) rotate(360deg); opacity: 0; }
  }

  .burst-particle{
    position: absolute;
    animation-name: burstOut;
    animation-timing-function: cubic-bezier(.2,.8,.3,1);
    animation-fill-mode: forwards;
  }
  @keyframes burstOut{
    0%{ transform: translate(0,0) scale(0.3) rotate(0deg); opacity: 1; }
    70%{ opacity: 1; }
    100%{ transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  /* ---------- screen transitions ---------- */
  .screen-enter{ animation: screenIn 0.7s cubic-bezier(.22,1,.36,1) both; }
  @keyframes screenIn{
    0%{ opacity: 0; transform: translateY(24px) scale(0.98); }
    100%{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .pop-in{ animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn{
    0%{ opacity:0; transform: scale(0.7); }
    100%{ opacity:1; transform: scale(1); }

  /* ---------- yes button pulse ---------- */
  .yes-btn{
    animation: pulseGlow 1.8s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(255,107,157,0.55), 0 10px 30px -8px rgba(232,76,136,0.55); transform: scale(1); }
    50%{ box-shadow: 0 0 0 14px rgba(255,107,157,0), 0 14px 34px -6px rgba(232,76,136,0.65); transform: scale(1.035); }
  }

  .no-btn{
    transition: top 0.28s cubic-bezier(.2,.9,.35,1.1), left 0.28s cubic-bezier(.2,.9,.35,1.1), transform 0.15s ease;
  }

  /* ---------- ticket / receipt ---------- */
  .ticket{
    position: relative;
    background: var(--white);
    border-radius: 22px;
    box-shadow: 0 20px 60px -20px rgba(179,24,78,0.35), 0 2px 8px rgba(179,24,78,0.08);
  }
  .ticket::before, .ticket::after{
    content: "";
    position: absolute;
    width: 28px; height: 28px;
    background: var(--pink-bg-1);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: inset 0 0 0 1px rgba(179,24,78,0.06);
  }
  .ticket::before{ left: -14px; }
  .ticket::after{ right: -14px; }
  .ticket-perforation{
    border-left: 2px dashed #F3B8CC;
  }

  .scrollbar-thin::-webkit-scrollbar{ width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background: var(--pink-blush); border-radius: 10px; }

  select{ -webkit-appearance:none; appearance:none; }

  .heart-emoji-btn{ transition: transform .18s ease, box-shadow .18s ease; }
  .heart-emoji-btn:hover{ transform: translateY(-4px) scale(1.02); }

  @media (prefers-reduced-motion: reduce){
    .particle, .yes-btn, .screen-enter, .pop-in { animation: none !important; }
  }
